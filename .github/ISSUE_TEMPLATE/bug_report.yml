name: Bug Report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! A few things worth checking first:
        - The [Tips and Pitfalls wiki page](https://github.com/DomeNinchen/ts6forkmanager/wiki/Tips-and-Pitfalls) covers behavior that looks like a bug but isn't.
        - Not sure it's actually a bug, or just have a question? [Discussions Q&A](https://github.com/DomeNinchen/ts6forkmanager/discussions/categories/q-a) is a better fit than an issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order, right before hitting this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      description: Backend, frontend, and sidecar are versioned independently - see Settings → Update Status in the app for exact version numbers.
      options:
        - Frontend (WebGui)
        - Backend
        - Sidecar (video streaming)
        - Not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Version(s)
      description: From Settings → Update Status, or the version shown in the sidebar footer.
      placeholder: e.g. Frontend 3.53.0, Backend 2.40.0
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker Compose (docker-compose.yml from this repo)
        - Built from source
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend/sidecar container logs, or browser console output, if there's anything relevant. This is pasted as-is, so no need to wrap it in a code block yourself.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't already been reported
          required: true
        - label: I checked the Tips and Pitfalls wiki page and this isn't covered there
          required: true
