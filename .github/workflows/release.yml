name: Monthly release

# Publishes one GitHub release per month, so the monthly CHANGELOG.md sections
# also show up under Releases and people can watch the repository for them.
# The tag (vYYYY.MM) marks main at the end of the month, the title names the
# backend, frontend and sidecar versions of that commit and the notes are the
# month's CHANGELOG section. The work is done by
# .github/scripts/monthly-release.sh, which skips a month that already has a
# release, so a second run changes nothing. Nothing is built or uploaded:
# installations are still built from source (git pull + docker compose).
#
# The monthly run publishes the month that just ended. A run by hand without a
# month, and a change to the release setup, publish every finished month that
# has no release yet.
#
# RELEASE_TOKEN (optional secret): GitHub refuses the built-in token a new tag
# on a commit whose workflow files differ from main's (403 "Resource not
# accessible by integration"), which is the case for every month before this
# workflow existed. A fine-grained personal access token for this repository
# only, with Contents and Workflows set to read and write, stored as the
# Actions secret RELEASE_TOKEN, lets those months through; without it they
# are reported and skipped, and the other months are published anyway. Only
# runs by hand and on a change to the release setup use it: the monthly run
# tags the month that just ended, which the built-in token may, so an expired
# or deleted RELEASE_TOKEN never stops it.
on:
  schedule:
    # 03:17 UTC on the 1st: the previous month is over in Berlin time too, and
    # away from the full hour, when scheduled runs queue up on GitHub.
    - cron: "17 3 1 * *"
  # A change to the release setup itself (first of all the merge that adds it)
  # publishes the months that are missing right away.
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/monthly-release.sh"
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM. Empty: every finished month without a release."
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  release:
    # The notes come from the CHANGELOG.md of the checked-out branch, so only main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script looks for the last commit of each month on origin/main.
          fetch-depth: 0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.event_name != 'schedule' && secrets.RELEASE_TOKEN || github.token }}
          # Scheduled: empty, i.e. the month that just ended. Otherwise the
          # month given by hand, or every finished month without a release.
          MONTH: ${{ github.event_name != 'schedule' && (inputs.month || 'all') || '' }}
        run: .github/scripts/monthly-release.sh "$MONTH"
