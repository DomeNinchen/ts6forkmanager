name: CI

# Typecheck and tests on every PR and on main. The test suite includes the
# schema-migrations-synced check, so a schema.prisma change without a matching
# migration fails CI (packages/backend/src/schema-migrations-synced.test.ts).
# The Go sidecar's tests and the frontend production build run as their own jobs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          # node:sqlite (used by the backend and its tests) is stable on Node 24.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ts6/common run build
      - run: pnpm --filter @ts6/backend exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test

  # Own jobs, so a failure in one does not hide the result of the others.
  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sidecar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The version the sidecar declares, not a guess.
          go-version-file: packages/sidecar/go.mod
          cache-dependency-path: packages/sidecar/go.sum
      # One test runs ffmpeg and skips itself when it is missing.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go test -v ./...

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ts6/common run build
      - run: pnpm --filter @ts6/frontend build
