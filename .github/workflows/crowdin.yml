name: Crowdin

# Keeps Crowdin's source strings current automatically, but never opens a
# translations PR on its own: pulling translations back in means a version
# bump + CHANGELOG entry too, same as every other change in this repo, so
# that step only runs when someone deliberately triggers it via "Run
# workflow". skip_untranslated_files keeps a language with zero real
# translations out of the PR entirely - Crowdin's own export otherwise fills
# an untranslated string with the English source text, which would silently
# add a "new language" that's actually just English under a different code.
# The upload_translations input is the opposite direction, for catching
# Crowdin up with the repo: the English source strings reach Crowdin on every
# push, but the German (and English) text written next to them in the repo
# does not, so after a stretch of new features Crowdin shows those languages
# as only partly translated. Ticking it pushes the repo's en and de files up
# instead of pulling anything down.
# Needs three repo secrets (Settings -> Secrets and variables -> Actions):
# CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN, and GH_TOKEN (see below).
on:
  push:
    branches: [main]
    paths:
      - "packages/frontend/src/locales/en/translation.json"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: "Push the repo's en and de translations up to Crowdin instead of pulling translations down"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  upload-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upload English source strings to Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  upload-translations:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_translations
    needs: upload-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [de, en]
    steps:
      - uses: actions/checkout@v7

      - name: Upload the ${{ matrix.language }} translations to Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: false
          upload_translations: true
          upload_language: ${{ matrix.language }}
          # A translation identical to its source is skipped by default, but
          # that is exactly what a loanword is here (Channel, Status, Online,
          # ...), and for English every string is identical to its source.
          import_eq_suggestions: true
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    if: github.event_name == 'workflow_dispatch' && !inputs.upload_translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull translations from Crowdin and open a PR
        uses: crowdin/github-action@v3
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_files: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: "New Crowdin translations"
          pull_request_body: |
            New and updated translations pulled from Crowdin.

            Before merging: this needs the same treatment as every other
            user-visible change in this repo - a frontend version bump and a
            CHANGELOG.md entry naming what language(s) changed. Ask Claude
            to take care of that in its own branch/PR before this one goes in
            (or fold this diff into that PR and close this one).
          pull_request_base_branch_name: "main"
        env:
          # A classic PAT with the "repo" scope, NOT the ambient GITHUB_TOKEN
          # Actions provides automatically - that one can't open pull requests
          # unless "Allow GitHub Actions to create and approve pull requests"
          # is turned on for this repo, and GITHUB_TOKEN is a reserved secret
          # name GitHub won't let a repo secret override anyway. Create at
          # github.com/settings/tokens and store it as the GH_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
