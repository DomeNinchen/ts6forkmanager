name: Trivy security scan

# Manual only -- no push/pull_request/schedule triggers. Run from the
# Actions tab ("Run workflow") when you want a security pass, e.g. before
# a release or after bumping dependencies.
on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to report"
        required: false
        default: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  filesystem:
    name: Filesystem, dependency, secret & misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Human-readable table report, same format as the one referenced in
      # clusterzx/ts6-manager#80 -- downloadable from the run's Summary page.
      - name: Run Trivy (table report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          format: table
          output: trivy-fs-report.txt
          exit-code: "0"

      - name: Upload table report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs-report.txt

      # Same scan again as SARIF, for the repo's Security tab (findings
      # linked to exact file/line, tracked across runs).
      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  images:
    name: Docker image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: sidecar
            dockerfile: Dockerfile.sidecar
          - name: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ts6-${{ matrix.name }}:scan

      - name: Run Trivy (table report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ts6-${{ matrix.name }}:scan
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          format: table
          output: trivy-${{ matrix.name }}-report.txt
          exit-code: "0"

      - name: Upload table report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}-image-report
          path: trivy-${{ matrix.name }}-report.txt

      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ts6-${{ matrix.name }}:scan
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
